[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conditioned-iqa-quickstart"
version = "0.1.0"
description = "Quick start for the summer-school project on conditioned image quality assessment"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers>=4.37",
    "pandas",
    "openpyxl",  # SPAQ and CID2013 ship their labels as xlsx
    "numpy",
    "scipy",
    "pillow",
    "tqdm",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools]
py-modules = [
    "arniqa",
    "dataset",
    "download_data",
    "download_data_mirrors",
    "evaluate",
    "evaluate_arniqa",
    "hf_mirror_utils",
    "prepare_data",
    "train",
]
