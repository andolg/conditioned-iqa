[project]
name = "conditioned-iqa-quickstart"
version = "0.1.0"
description = "Quick start for the summer-school project on conditioned image quality assessment"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers>=4.37",
    "pandas",
    "openpyxl",  # SPAQ and CID2013 ship their labels as xlsx
    "numpy",
    "scipy",
    "pillow",
]

# The scripts sit at the repo root rather than in a package, and setuptools
# refuses to guess which of them to install. Naming them keeps `pip install -e .`
# working and makes them importable from anywhere.
[tool.setuptools]
py-modules = [
    "dataset",
    "download_data",
    "download_dataset_mirrors",
    "prepare_data",
    "train",
]
